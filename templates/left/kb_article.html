{% extends "base.html" %}

{% block content %}
<div class="max-w-3xl mx-auto">
    <nav class="flex mb-6 text-sm text-gray-500" 
         hx-boost="true" 
         hx-target="#main-content" 
         hx-select="#main-content" 
         hx-swap="outerHTML show:top">
        <a href="/troubleshooting" class="hover:text-blue-600">Troubleshooting</a>
        <span class="mx-2">/</span>
        <a href="/troubleshooting/{{ category }}" class="hover:text-blue-600">{{ category }}</a>
        <span class="mx-2">/</span>
        <span class="text-gray-900 font-medium">Article {{ article.id }}</span>
    </nav>

    <div class="bg-white p-8 rounded-2xl border border-gray-200 shadow-sm">
        <div class="flex items-center gap-3 mb-4">
            <span class="px-2.5 py-0.5 rounded-full text-xs font-medium bg-blue-100 text-blue-800">{{ category }}</span>
            <span class="text-sm text-gray-500">⏱️ {{ article.est_time }}</span>
        </div>
        
        <h1 class="text-3xl font-bold text-gray-900 mb-8">{{ article.title }}</h1>

        <div class="space-y-6">
            {% for step in article.content_steps %}
            <div class="flex gap-4">
                <div class="flex-shrink-0 h-8 w-8 rounded-full bg-blue-600 text-white flex items-center justify-center font-bold">
                    {{ loop.index }}
                </div>
                <div class="pt-1 text-gray-800 leading-relaxed">
                    {{ step }}
                </div>
            </div>
            {% endfor %}
        </div>

        <div class="mt-10 pt-6 border-t border-gray-100">
            <p class="text-sm text-gray-500 mb-3 font-medium">Was this article helpful?</p>
            <div class="flex gap-3">
                <button class="px-4 py-2 border border-gray-300 rounded-lg hover:bg-gray-50 text-sm">👍 Yes</button>
                <button class="px-4 py-2 border border-gray-300 rounded-lg hover:bg-gray-50 text-sm">👎 No</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}
