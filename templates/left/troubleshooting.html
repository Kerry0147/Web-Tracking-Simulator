{% extends "base.html" %}

{% block content %}
<div class="max-w-4xl mx-auto">
    <h1 class="text-3xl font-bold text-gray-900 mb-2">Troubleshooting & Support</h1>
    <p class="text-gray-500 mb-10">Select a category below to find step-by-step guides for your device.</p>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6" 
         hx-boost="true" 
         hx-target="#main-content" 
         hx-select="#main-content" 
         hx-swap="outerHTML show:top">
         
        <a href="/troubleshooting/audio" class="group bg-white p-6 rounded-xl border border-gray-200 shadow-sm hover:shadow-md hover:border-blue-300 transition-all">
            <div class="h-12 w-12 bg-blue-50 text-blue-600 rounded-lg flex items-center justify-center text-2xl mb-4 group-hover:bg-blue-600 group-hover:text-white transition-colors">🔊</div>
            <h3 class="text-xl font-bold text-gray-900 mb-1">Audio & Sound</h3>
            <p class="text-sm text-gray-500">3 Articles</p>
        </a>

        <a href="/troubleshooting/monitor" class="group bg-white p-6 rounded-xl border border-gray-200 shadow-sm hover:shadow-md hover:border-blue-300 transition-all">
            <div class="h-12 w-12 bg-purple-50 text-purple-600 rounded-lg flex items-center justify-center text-2xl mb-4 group-hover:bg-purple-600 group-hover:text-white transition-colors">🖥️</div>
            <h3 class="text-xl font-bold text-gray-900 mb-1">Display & Monitor</h3>
            <p class="text-sm text-gray-500">3 Articles</p>
        </a>

        <a href="/troubleshooting/keyboard" class="group bg-white p-6 rounded-xl border border-gray-200 shadow-sm hover:shadow-md hover:border-blue-300 transition-all">
            <div class="h-12 w-12 bg-orange-50 text-orange-600 rounded-lg flex items-center justify-center text-2xl mb-4 group-hover:bg-orange-600 group-hover:text-white transition-colors">⌨️</div>
            <h3 class="text-xl font-bold text-gray-900 mb-1">Keyboard & Input</h3>
            <p class="text-sm text-gray-500">3 Articles</p>
        </a>

        <a href="/troubleshooting/battery" class="group bg-white p-6 rounded-xl border border-gray-200 shadow-sm hover:shadow-md hover:border-blue-300 transition-all">
            <div class="h-12 w-12 bg-green-50 text-green-600 rounded-lg flex items-center justify-center text-2xl mb-4 group-hover:bg-green-600 group-hover:text-white transition-colors">🔋</div>
            <h3 class="text-xl font-bold text-gray-900 mb-1">Power & Battery</h3>
            <p class="text-sm text-gray-500">3 Articles</p>
        </a>
    </div>
</div>
{% endblock %}
